name: Core data local security
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/core-data-local.yml']
permissions:
  contents: read
jobs:
  local-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx --yes supabase@2.117.0 --version
      - run: npx --yes supabase@2.117.0 start --exclude studio,logflare,vector,supavisor,edge-runtime,realtime,imgproxy
      - run: npx --yes supabase@2.117.0 db reset --local --no-seed --yes
      - run: npx --yes supabase@2.117.0 db lint --local --fail-on error
      - run: npx --yes supabase@2.117.0 db advisors --local --type security --fail-on error
      - run: npx --yes supabase@2.117.0 test db
      - name: Two synthetic local users and real Storage API
        run: |
          npx --yes supabase@2.117.0 status -o json > "$RUNNER_TEMP/supabase-local.json"
          LOCAL_SUPABASE_PUBLISHABLE_KEY="$(node -e 'const s=require(process.argv[1]); process.stdout.write(s.PUBLISHABLE_KEY || s.ANON_KEY)' "$RUNNER_TEMP/supabase-local.json")" node scripts/local-security.mjs
      - if: always()
        run: npx --yes supabase@2.117.0 stop --no-backup
